
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AI-Powered Smart CV Analyzer</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #e3f2fd 0%, #fce4ec 100%);
            font-family: 'Roboto', Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
        }
        .center-card {
            max-width: 420px;
            margin: 60px auto 0 auto;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            padding: 36px 32px 28px 32px;
            text-align: center;
        }
        .center-card h1 {
            font-size: 2.1rem;
            font-weight: 700;
            color: #1976d2;
            margin-bottom: 18px;
        }
        .center-card .icon {
            font-size: 3.2rem;
            margin-bottom: 10px;
        }
        .upload-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        input[type="file"] {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #bdbdbd;
            width: 100%;
            background: #f5f5f5;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #bdbdbd;
            font-size: 1rem;
            margin-top: 6px;
            background: #f5f5f5;
        }
        button[type="submit"] {
            background: linear-gradient(90deg, #1976d2 60%, #7e57c2 100%);
            color: #fff;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            padding: 12px 0;
            width: 100%;
            font-size: 1.08rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.08);
            transition: background 0.2s;
        }
        button[type="submit"]:hover {
            background: linear-gradient(90deg, #1565c0 60%, #6d4ea7 100%);
        }
        .note {
            font-size: 0.98rem;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="center-card">
        <div class="icon">🧠</div>
        <h1>Smart CV Analysis & Optimization</h1>
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label class="upload-label">Upload your CV (PDF / DOCX / Image):</label>
                <input type="file" name="cv_file" accept=".pdf,.docx,.jpg,.jpeg,.png" required>
            </div>
            <div class="form-group">
                <label for="target_role" class="upload-label">Target Job Role:</label>
                <input type="text" name="target_role" id="target_role" placeholder="e.g. Data Analyst, Backend Developer">
            </div>
            <button type="submit">Upload & Analyze CV</button>
        </form>
        <div class="note">Your CV is processed securely. Supported formats: PDF, DOCX, JPG, PNG.</div>
    </div>
</body>
</html>
